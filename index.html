<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب استقدام عمالة منزلية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f4; margin: 0; padding-bottom: 80px; text-align: center; }
        header { background: #1e3a8a; color: white; padding: 20px; }
        
        /* البطاقات */
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px; }
        .card { background: white; width: 160px; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
        .card h4 { margin: 10px 0 5px; font-size: 14px; }
        .card p { font-size: 12px; color: #666; margin: 0 0 10px; }
        
        /* الأزرار العائمة */
        .float-nav { position: fixed; bottom: 0; width: 100%; display: flex; }
        .float-nav a { flex: 1; padding: 15px; color: white; text-decoration: none; font-weight: bold; text-align: center; }
        .wa { background: #25d366; }
        .call { background: #0284c7; }
    </style>
</head>
<body>

<header>
    <h1>مكتب استقدام العمالة</h1>
</header>

<div class="container">
    <!-- يمكنك تكرار هذا الجزء لكل عاملة -->
    <div class="card">
        <img src="رابط_صورتك_هنا" alt="عاملة">
        <h4>الاسم</h4>
        <p>المرجع: 12345</p>
    </div>
    <!-- انتهى تكرار العاملة -->
</div>

<!-- الأزرار العائمة -->
<div class="float-nav">
    <a href="https://wa.me/966558900935" class="wa">واتساب 💬</a>
    <a href="tel:+966558900935" class="call">اتصال 📞</a>
</div>

</body>
</html>
