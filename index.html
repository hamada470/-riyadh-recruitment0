<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب استقدام عمالة - الرياض</title>
    <style>
        :root { --primary: #1e3a8a; --whatsapp: #25d366; --call: #0284c7; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; }
        
        /* حركة الدخول */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-card { animation: fadeInUp 0.8s ease forwards; }

        header { background: #fff; padding: 30px; text-align: center; border-bottom: 3px solid var(--primary); }
        h1 { color: var(--primary); }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1000px; margin: auto; }
        
        .card { background: #fff; padding: 15px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .card:hover { transform: scale(1.02); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; }

        /* الأزرار العائمة */
        .floating-container { position: fixed; bottom: 20px; left: 20px; right: 20px; display: flex; gap: 10px; z-index: 999; }
        .btn-float { flex: 1; padding: 15px; border-radius: 50px; color: white; text-align: center; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(5px); }
        .whatsapp { background: var(--whatsapp); }
        .call { background: var(--call); }
    </style>
</head>
